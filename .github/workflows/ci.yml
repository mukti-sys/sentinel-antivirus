name: Sentinel Antivirus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest sentinel/tests/unit/ -v --tb=short -q

  integration-tests:
    name: Real E2E Tests (Windows) — No Mocks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run real end-to-end integration tests
        run: |
          python -m pytest sentinel/tests/integration/test_real_e2e.py -v --tb=long

  build-driver:
    name: Build Kernel Driver & C Tests (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit (WDK 26100)
        shell: powershell
        run: |
          Write-Host "Downloading WDK Build 26100 installer..."
          $wdkUrl = "https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
          $installerPath = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $installerPath

          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $installerPath -ArgumentList "/features + /q" -PassThru -Wait
          Write-Host "WDK installer exit code: $($proc.ExitCode)"

          Write-Host "Configuring WDK MSBuild integration for VS2022..."
          $vsixPath = "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022\WDK.vsix"
          if (Test-Path $vsixPath) {
              Write-Host "Found WDK.vsix at $vsixPath"
              $extractPath = "$env:TEMP\wdk_vsix"
              Expand-Archive -Path $vsixPath -DestinationPath $extractPath -Force
              
              $vc170 = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170"
              
              # Recursively find and copy BuildCustomizations
              Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "BuildCustomizations" | ForEach-Object {
                  Write-Host "Found BuildCustomizations at $($_.FullName)"
                  Copy-Item -Path "$($_.FullName)\*" -Destination "$vc170\BuildCustomizations" -Recurse -Force
              }
              
              # Recursively find and copy PlatformToolsets\WindowsKernelModeDriver10.0
              Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "WindowsKernelModeDriver10.0" | ForEach-Object {
                  Write-Host "Found toolset at $($_.FullName)"
                  $toolsetDest = "$vc170\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
                  New-Item -ItemType Directory -Path $toolsetDest -Force | Out-Null
                  Copy-Item -Path "$($_.FullName)\*" -Destination $toolsetDest -Recurse -Force
              }

              # Also copy entire $MSBuild tree if present
              $sourceRoot = Join-Path $extractPath '$MSBuild'
              if (Test-Path $sourceRoot) {
                  Copy-Item -Path "$sourceRoot\*" -Destination "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild" -Recurse -Force
              }

              $installedToolsets = Get-ChildItem "$vc170\Platforms\x64\PlatformToolsets" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              Write-Host "Available x64 toolsets in VS2022: $($installedToolsets -join ', ')"
          } else {
              Write-Host "[WARNING] WDK.vsix not found at $vsixPath"
          }

      - name: Build SentinelFilter.sys (Release x64)
        shell: powershell
        run: |
          msbuild driver\SentinelFilter\SentinelFilter.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:Inf2Cat=Off /fl /flp:logfile=build.log;verbosity=normal
        continue-on-error: true

      - name: Publish Build Diagnostics to Step Summary
        if: always()
        shell: powershell
        run: |
          "# Driver Build Diagnostic Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path "build.log") {
              "### MSBuild Log (tail 100 lines):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content "build.log" -Tail 100 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
              "No build.log file was generated." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Verify Driver Binary Exists
        shell: powershell
        run: |
          $sys = "driver\SentinelFilter\x64\Release\SentinelFilter.sys"
          if (-not (Test-Path $sys)) {
              Write-Host "[FATAL] SentinelFilter.sys was not produced!" -ForegroundColor Red
              exit 1
          }
          Write-Host "[SUCCESS] SentinelFilter.sys was built! Size: $((Get-Item $sys).Length) bytes" -ForegroundColor Green

      - name: Upload SentinelFilter Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelFilter-driver-x64
          path: |
            driver/SentinelFilter/x64/Release/SentinelFilter.sys
            driver/SentinelFilter/SentinelFilter.inf
            driver/scripts/install_driver.ps1
            driver/scripts/setup_signing.ps1
