name: Sentinel Antivirus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest sentinel/tests/unit/ -v --tb=short -q

  integration-tests:
    name: Real E2E Tests (Windows) — No Mocks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run real end-to-end integration tests
        run: |
          python -m pytest sentinel/tests/integration/test_real_e2e.py -v --tb=long

  build-driver:
    name: Build Kernel Driver & C Tests (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit (WDK 26100)
        shell: powershell
        run: |
          Write-Host "Downloading WDK Build 26100 installer..."
          $wdkUrl = "https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
          $installerPath = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $installerPath

          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $installerPath -ArgumentList "/features + /q" -PassThru -Wait
          Write-Host "WDK installer exit code: $($proc.ExitCode)"

          Write-Host "Configuring WDK MSBuild integration..."
          $kitRoot = "C:\Program Files (x86)\Windows Kits\10"

          # 1. Extract WDK toolsets and build files to a staging directory
          $stagingDir = "$env:TEMP\wdk_staging"
          New-Item -ItemType Directory -Path "$stagingDir\toolset" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stagingDir\customizations" -Force | Out-Null

          # Search in Windows Kits 10 root
          Get-ChildItem -Path $kitRoot -Recurse -Directory -Filter "WindowsKernelModeDriver10.0" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Found toolset in KitRoot: $($_.FullName)"
              Copy-Item -Path "$($_.FullName)\*" -Destination "$stagingDir\toolset" -Recurse -Force
          }
          if (Test-Path "$kitRoot\build") {
              Copy-Item -Path "$kitRoot\build\*" -Destination "$stagingDir\customizations" -Recurse -Force
          }

          # Search in WDK.vsix
          $vsixPath = "$kitRoot\Vsix\VS2022\WDK.vsix"
          if (Test-Path $vsixPath) {
              Write-Host "Extracting WDK.vsix at $vsixPath"
              $extractPath = "$env:TEMP\wdk_vsix"
              Expand-Archive -Path $vsixPath -DestinationPath $extractPath -Force
              Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "WindowsKernelModeDriver10.0" -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "Found toolset in VSIX: $($_.FullName)"
                  Copy-Item -Path "$($_.FullName)\*" -Destination "$stagingDir\toolset" -Recurse -Force
              }
              Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "BuildCustomizations" -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "Found BuildCustomizations in VSIX: $($_.FullName)"
                  Copy-Item -Path "$($_.FullName)\*" -Destination "$stagingDir\customizations" -Recurse -Force
              }
          }

          # 2. Duplicate task DLLs (17.0 -> 18.0) so any VisualStudioVersion will find its task assembly
          Get-ChildItem -Path $kitRoot -Recurse -Filter "Microsoft.DriverKit.Build.Tasks.*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Found task DLL: $($_.FullName)"
              $dest18 = Join-Path $_.DirectoryName "Microsoft.DriverKit.Build.Tasks.18.0.dll"
              if (-not (Test-Path $dest18)) {
                  Copy-Item $_.FullName $dest18 -Force
                  Write-Host "Created fallback task DLL: $dest18"
              }
          }

          # 3. Deploy to ALL Visual Studio instances found on system
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPaths = @()
          if (Test-Path $vswhere) {
              $vsPaths = & $vswhere -all -property installationPath
          }
          $vsPaths += "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $vsPaths = $vsPaths | Select-Object -Unique

          foreach ($vsPath in $vsPaths) {
              if (Test-Path $vsPath) {
                  Write-Host "Deploying WDK MSBuild files to: $vsPath"
                  Get-ChildItem -Path "$vsPath\MSBuild\Microsoft\VC" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                      $vcDir = $_.FullName
                      $toolsetDest = "$vcDir\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
                      $customDest = "$vcDir\BuildCustomizations"
                      New-Item -ItemType Directory -Path $toolsetDest -Force | Out-Null
                      New-Item -ItemType Directory -Path $customDest -Force | Out-Null
                      Copy-Item -Path "$stagingDir\toolset\*" -Destination $toolsetDest -Recurse -Force
                      Copy-Item -Path "$stagingDir\customizations\*" -Destination $customDest -Recurse -Force
                      Write-Host "  Configured $vcDir"
                  }
              }
          }

      - name: Build SentinelFilter.sys (Release x64)
        shell: cmd
        run: |
          msbuild -version
          msbuild driver\SentinelFilter\SentinelFilter.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:Inf2Cat=Off /p:VisualStudioVersion=17.0 /v:n
          IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%

      - name: Verify Driver Binary Exists
        shell: powershell
        run: |
          Write-Host "Searching for produced .sys files..."
          $sysFiles = Get-ChildItem -Recurse -Filter "SentinelFilter.sys" -ErrorAction SilentlyContinue
          foreach ($f in $sysFiles) {
              Write-Host "Found: $($f.FullName) ($($f.Length) bytes)"
          }
          $expected = "driver\SentinelFilter\x64\Release\SentinelFilter.sys"
          if (-not (Test-Path $expected)) {
              if ($sysFiles.Count -gt 0) {
                  Write-Host "Copying $($sysFiles[0].FullName) to $expected"
                  New-Item -ItemType Directory -Path (Split-Path $expected) -Force | Out-Null
                  Copy-Item $sysFiles[0].FullName $expected -Force
              } else {
                  Write-Host "[FATAL] No SentinelFilter.sys found anywhere in repo!" -ForegroundColor Red
                  exit 1
              }
          }
          Write-Host "[SUCCESS] SentinelFilter.sys is verified: $expected" -ForegroundColor Green

      - name: Upload SentinelFilter Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelFilter-driver-x64
          path: |
            driver/SentinelFilter/x64/Release/SentinelFilter.sys
            driver/SentinelFilter/SentinelFilter.inf
            driver/scripts/install_driver.ps1
            driver/scripts/setup_signing.ps1
