name: Sentinel Antivirus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest sentinel/tests/unit/ -v --tb=short -q

  integration-tests:
    name: Real E2E Tests (Windows) — No Mocks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run real end-to-end integration tests
        run: |
          python -m pytest sentinel/tests/integration/test_real_e2e.py -v --tb=long

  build-driver:
    name: Build Kernel Driver & C Tests (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit (WDK 26100)
        shell: powershell
        run: |
          Write-Host "Downloading WDK Build 26100 installer..."
          $wdkUrl = "https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe"
          $installerPath = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $installerPath

          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $installerPath -ArgumentList "/features + /q" -PassThru -Wait
          Write-Host "WDK installer exit code: $($proc.ExitCode)"

          Write-Host "Configuring WDK MSBuild integration for VS2022..."
          $vsixPath = "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022\WDK.vsix"
          if (Test-Path $vsixPath) {
              Write-Host "Found WDK.vsix at $vsixPath"
              # 1. Attempt official VSIXInstaller
              $vsixInstaller = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\VSIXInstaller.exe"
              if (Test-Path $vsixInstaller) {
                  Write-Host "Running VSIXInstaller..."
                  $p = Start-Process -FilePath $vsixInstaller -ArgumentList "/quiet /admin `"$vsixPath`"" -PassThru -Wait
                  Write-Host "VSIXInstaller exit code: $($p.ExitCode)"
              }
              
              # 2. Extract and manually copy targets (guaranteed fallback)
              $extractPath = "$env:TEMP\wdk_vsix"
              Expand-Archive -Path $vsixPath -DestinationPath $extractPath -Force
              
              $sourceRoot = Join-Path $extractPath '$MSBuild'
              if (Test-Path $sourceRoot) {
                  Write-Host "Found `$MSBuild in extracted VSIX"
                  $destRoots = @(
                      "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild",
                      "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild",
                      "C:\Program Files (x86)\MSBuild"
                  )
                  foreach ($dest in $destRoots) {
                      if (Test-Path $dest) {
                          Copy-Item -Path "$sourceRoot\*" -Destination $dest -Recurse -Force
                          Write-Host "Copied targets to $dest"
                      }
                  }
              }
              
              # Verify platform toolset exists
              $toolsetCheck = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild" -Recurse -Filter "*WindowsKernelModeDriver10.0*" -ErrorAction SilentlyContinue
              Write-Host "Found toolset items: $($toolsetCheck.Count)"
          } else {
              Write-Host "[WARNING] WDK.vsix not found at $vsixPath"
          }

      - name: Build SentinelFilter.sys (Release x64)
        shell: cmd
        run: |
          msbuild driver\SentinelFilter\SentinelFilter.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:Inf2Cat=Off /v:m

      - name: Upload SentinelFilter Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelFilter-driver-x64
          path: |
            driver/SentinelFilter/x64/Release/SentinelFilter.sys
            driver/SentinelFilter/SentinelFilter.inf
            driver/scripts/install_driver.ps1
            driver/scripts/setup_signing.ps1
